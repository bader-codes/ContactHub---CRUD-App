<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- BootStrat Files -->
    <link rel="stylesheet" href="./vendor/bootstrap/bootstrap.min.css" />
    <script src="./vendor/bootstrap/bootstrap.bundle.min.js" defer></script>

    <!-- Css Main File -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Font Awsome Files -->
    <link rel="stylesheet" href="./vendor/fontawesome/all.min.css" />
    <script src="./vendor/fontawesome/all.min.js" defer></script>
    <script src="./js/index.js" type="module" defer></script>

    <!-- Import Sweet Alert Libarey -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>ContactHub - CRUD App</title>
  </head>

  <body>
    <!-- Start Code Header -->
    <header class="position-fixed w-100 top-0">
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <div class="main-header-logo d-flex align-items-center">
            <div
              class="main-logo d-flex align-items-center justify-content-center me-3"
            >
              <i class="fa-solid fa-address-book fs-4 text-white"></i>
            </div>

            <div class="d-none d-sm-block">
              <h1 class="fs-4 fw-bold m-0">
                Contact<span class="main-headig-span">Hub</span>
              </h1>

              <p class="m-0 fs-6 fw-bold">Smart Contact Manager</p>
            </div>
          </div>
          <div>
            <ul class="navbar-nav ms-auto">
              <li class="nav-item d-flex align-items-center gap-3">
                <div class="add-contact-button">
                  <button
                    id="add-contact-btn"
                    class="d-flex align-items-center add-contact py-2 px-3 text-white fw-bold"
                  >
                    <i class="fa-solid fa-plus me-1"></i>
                    <span class="d-none d-lg-block">Add Contact</span>
                    <span class="d-block d-lg-none">Add</span>
                  </button>
                </div>
                <div
                  class="account-image d-flex align-items-center justify-content-center"
                >
                  <img
                    src="./assets/images/avatar-4.jpg"
                    alt="personal-image"
                  />
                </div>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <!-- End Code Header -->

    <!-- Summary Cards -->
    <section class="py-4 mt-5">
      <div class="container mt-5">
        <div class="contacts-summary row">
          <!-- Total Card -->
          <div class="col-12 col-md-6 col-lg-4 my-3">
            <div
              class="total-contact summary-card p-3 d-flex align-items-center rounded-4 gap-3"
            >
              <div
                class="total-contact-icon icon px-1 py-3 rounded-3 d-flex align-items-center justify-content-center"
              >
                <i class="fa-solid fa-users fs-5 d-block mx-3 text-white"></i>
              </div>

              <div>
                <p class="m-0 text-uppercase fs-5">Total</p>
                <p
                  id="total-contact-count"
                  class="fw-bold fs-5 m-0"
                >
                  0
                </p>
              </div>
            </div>
          </div>

          <!-- Favorites Card -->
          <div class="col-12 col-md-6 col-lg-4 my-3">
            <div
              class="favorites-contact summary-card p-3 d-flex align-items-center rounded-4 gap-3"
            >
              <div
                class="favorites-contact-icon icon px-1 py-3 rounded-3 d-flex align-items-center justify-content-center"
              >
                <i class="fa-solid fa-star d-block mx-3 fs-5 text-white"></i>
              </div>

              <div>
                <p class="m-0 text-uppercase fs-5">Favorites</p>
                <p
                  id="favorites-contact-count"
                  class="fw-bold fs-5 m-0"
                >
                  0
                </p>
              </div>
            </div>
          </div>

          <!-- Emergency Card -->
          <div class="col-12 col-md-6 col-lg-4 my-3">
            <div
              class="emergency-contact summary-card p-3 d-flex align-items-center rounded-4 gap-3"
            >
              <div
                class="emergency-contact-icon icon px-1 py-3 rounded-3 d-flex align-items-center justify-content-center"
              >
                <i
                  class="fa-solid fa-heart-pulse d-block mx-3 fs-4 text-white"
                ></i>
              </div>

              <div>
                <p class="m-0 text-uppercase fs-5">Emergency</p>
                <p
                  id="emergency-contact-count"
                  class="fw-bold fs-5 m-0"
                >
                  0
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Summary Cards -->

    <!-- Modal Data Box -->
    <section class="contact-modal-box position-fixed d-none" id="contact-modal">
      <div class="position-fixed top-0 start-0 bottom-0 end-0 overlay"></div>
      <div
        class="position-fixed top-0 start-0 bottom-0 end-0 d-flex justify-content-center"
      >
        <div class="row w-100 d-flex align-items-center justify-content-center">
          <div class="col-12 col-md-10 col-lg-6">
            <div class="bg-white rounded-4 contact-box overflow-auto">
              <div
                class="contact-box-header d-flex align-items-center border-bottom justify-content-between sticky-top bg-white p-3"
              >
                <h2 class="fs-6 fw-bold m-0">Add New Contact</h2>
                <button
                  class="contact-close-button d-flex align-items-center justify-content-center rounded-1 p-1"
                  id="close-btn"
                  type="button"
                >
                  <i class="fa-solid fa-xmark fs-5"></i>
                </button>
              </div>

              <form class="py-2 px-4 px-lg-5" id="contact-form-control">
                <div
                  class="w-100 d-flex flex-column align-items-center justify-content-center py-2 mb-3"
                >
                  <div
                    class="contact-photo rounded-circle d-flex align-items-center justify-content-center"
                  >
                    <img
                      src="./assets/images/phone.webp"
                      id="user-photo"
                      class="w-100 h-100 rounded-circle user-live-photo"
                      alt="userPhoto"
                      accept="image/*"
                    />
                  </div>
                </div>

                <div class="mb-3 input-data-info">
                  <label for="full-name-input" class="form-label fw-500">
                    Full Name
                    <span class="reqier-icon">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control full-name"
                    id="full-name-input"
                    placeholder="Enter First Name"
                  />
                  <span id="name-error-msg" class="validation-msg"></span>
                </div>

                <div class="mb-3 input-data-info">
                  <label for="phone-input" class="form-label fw-500">
                    Phone Number
                    <span class="reqier-icon">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control full-name"
                    id="phone-input"
                    placeholder="e.g. 01026450424"
                  />
                  <span id="phone-error-msg" class="validation-msg"></span>
                </div>

                <div class="mb-3 input-data-info">
                  <label for="email-input" class="form-label fw-500">
                    Email address
                  </label>
                  <input
                    type="email"
                    class="form-control"
                    id="email-input"
                    placeholder="name@example.com"
                  />
                  <span id="email-error-msg" class="validation-msg"></span>
                </div>

                <div class="mb-3 input-data-info">
                  <label for="address-input" class="form-label fw-500"
                    >Address</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="address-input"
                    placeholder="Enter Address"
                  />
                  <span id="address-error-msg" class="validation-msg"></span>
                </div>

                <div class="mb-3 input-data-info d-flex flex-column">
                  <label
                    for="groupe-input"
                    class="form-label groupe-label fw-500"
                    >Groupe</label
                  >
                  <select
                    class="form-select form-control groupe-label"
                    id="groupe-input"
                  >
                    <option selected>Select Groupe</option>
                    <option value="1">Family</option>
                    <option value="2">Friends</option>
                    <option value="3">Work</option>
                    <option value="4">School</option>
                    <option value="3">Other</option>
                  </select>
                </div>

                <div class="px-3">
                  <div class="row align-items-center py-3 g-3">
                    <div class="col-12 col-lg-6 p-0">
                      <div class="form-check d-flex align-items-center">
                        <input
                          class="form-check-input me-2"
                          type="checkbox"
                          value=""
                          id="eme-input"
                        />
                        <label
                          class="form-check-label mt-1 d-flex align-items-center justify-content-center"
                          for="eme-input"
                        >
                          <i class="fa-solid fa-heart-pulse me-2"></i>
                          <span class="fw-500">Emergency</span>
                        </label>
                      </div>
                    </div>

                    <div class="col-12 col-lg-6 p-0">
                      <div class="form-check d-flex align-items-center">
                        <input
                          class="form-check-input me-2"
                          type="checkbox"
                          value=""
                          id="fav-input"
                        />
                        <label
                          class="form-check-label mt-1 d-flex align-items-center justify-content-center"
                          for="fav-input"
                        >
                          <i class="fa-solid fa-star me-2"></i>
                          <span class="fw-500">Favorite</span>
                        </label>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="form-contact-button py-2">
                  <div class="row justify-content-between">
                    <div class="col-6 p-2">
                      <button
                        class="cancel-button rounded-2 fw-600 w-100 py-2"
                        id="cancel-contact-btn"
                        type="button"
                      >
                        Cancel
                      </button>
                    </div>
                    <div class="col-6 p-2">
                      <button
                        class="save-button rounded-2 fw-600 fs-6 w-100 py-2 text-white d-flex align-items-center justify-content-center"
                        id="save-contact-btn"
                        type="button"
                      >
                        <i class="fa-solid fa-check me-2"></i>
                        <span>Save</span>
                      </button>

                      <button
                        id="update-contact-btn"
                        class="update-button bg-warning rounded-2 fw-600 fs-6 w-100 py-2 text-white d-flex align-items-center justify-content-center d-none"
                      >
                        <i class="fa-solid fa-pen me-2"></i>
                        <span>Update</span>
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Modal Data Box -->

    <main>
      <div class="container">
        <div class="row g-lg-5">
          <div class="col-12 col-lg-7">
            <div class="mb-3">
              <h2 class="mb-1 fw-bold main-title">All Contacts</h2>
              <p class="m-0 fs-7 main-description" id="main-description">
                Manage and organize your 0 contacts
              </p>
            </div>

            <div
              class="d-flex flex-column align-items-center justify-content-center"
            >
              <div class="search-box position-relative w-100">
                <input
                  type="text"
                  placeholder="Search by name, phone, or email..."
                  id="search-input"
                  class="search-input rounded-2 w-100"
                />

                <i class="fa-solid fa-magnifying-glass search-icon"></i>
              </div>

              <div id="contact-list" class="contact-list w-100"></div>
            </div>
          </div>

          <div class="col-12 col-lg-5 py-4">
            <section
              id="favorites-contact-data"
              class="shadow favorites-data mb-5 rounded-4"
            >
              <div class="d-flex flex-column">
                <div class="favorites-contact-card rounded-top-4 d-flex p-2">
                  <div
                    class="favorites-contact-icon contact-icon d-flex align-items-center justify-content-center me-2"
                  >
                    <i class="fa-solid fa-star"></i>
                  </div>

                  <div>
                    <h2 class="fs-6 fw-bold m-0">Favorites</h2>
                    <p class="fs-7 m-0">Quick access</p>
                  </div>
                </div>

                <div class="favorites-contact-menu py-3 px-3 px-lg-4" id="favorite-contact-menu">

                </div>
              </div>
            </section>
            <section
              id="emergency-contact-data"
              class="shadow emergency-data rounded-4"
            >
              <div class="d-flex flex-column">
                <div class="emergency-contact-card d-flex p-2 rounded-top-4">
                  <div
                    class="emergency-contact-icon contact-icon d-flex align-items-center justify-content-center me-2"
                  >
                    <i class="fa-solid fa-heart-crack"></i>
                  </div>

                  <div>
                    <h2 class="fs-6 fw-bold m-0">emergency</h2>
                    <p class="fs-7 m-0">Quick access</p>
                  </div>
                </div>

                <div
                  class="emergency-contact-menu py-3 px-3 px-lg-4"
                  id="emergency-contact-menu"
                >

                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
